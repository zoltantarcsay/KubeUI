# Minimal writable git server (git daemon) for the kind demo: Argo CD reads it in-cluster,
# you push to it through `kubectl port-forward svc/gitserver 9418`.
apiVersion: v1
kind: Namespace
metadata: {name: gitops}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gitserver, namespace: gitops}
spec:
  replicas: 1
  selector: {matchLabels: {app: gitserver}}
  template:
    metadata: {labels: {app: gitserver}}
    spec:
      initContainers:
      - name: init
        image: alpine/git:2.47.2
        command: [sh, -c]
        args:
        - |
          [ -d /srv/git/gitops.git ] || { git init --bare -b main /srv/git/gitops.git && git -C /srv/git/gitops.git config daemon.receivepack true; }
        volumeMounts: [{name: repos, mountPath: /srv/git}]
      containers:
      - name: git
        image: alpine:3.20
        command: [sh, -c]
        args: ["apk add --no-cache git git-daemon >/dev/null && exec git daemon --verbose --export-all --enable=receive-pack --reuseaddr --base-path=/srv/git /srv/git"]
        ports: [{containerPort: 9418}]
        volumeMounts: [{name: repos, mountPath: /srv/git}]
      volumes:
      - name: repos
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: gitserver, namespace: gitops}
spec:
  selector: {app: gitserver}
  ports: [{port: 9418, targetPort: 9418}]
